services:
  api:
    build: .
    environment:
      - MODEL_NAME=bge-m3
      - MODEL_SERVER_URL=http://ollama:11434/v1/embeddings
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 10s
      retries: 5

volumes:
  ollama_data: